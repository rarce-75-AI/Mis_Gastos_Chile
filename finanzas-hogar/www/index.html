ding:13px;border:1px solid #435774;background:#0f1c30;color:white;border-radius:10px;font:inherit}input[type=checkbox]{width:auto}.overlay{display:none;position:fixed;inset:0;z-index:4;background:#030914bb;align-items:end}.overlay.on{display:flex}.sheet{background:#1b2940;border-radius:22px 22px 0 0;padding:20px;width:100%;max-height:92vh;overflow:auto}.sheet h2{margin:0}.sheet .row{margin-bottom:10px}.plot{width:140px;height:140px;border-radius:50%;margin:14px auto;background:#35445c;display:grid;place-items:center}.plot span{width:85px;height:85px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;font-size:12px}.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px}.legend div{font-size:12px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}.progress{height:9px;background:#33435d;border-radius:10px;overflow:hidden;margin:12px 0}.progress div{background:var(--mint);height:100%}.empty{color:var(--muted);padding:13px 0}.toolbar{display:flex;align-items:center;justify-content:center;gap:25px;margin-bottom:12px}.toolbar button{font-size:23px;padding:4px 12px}.error{color:var(--red);margin-top:8px}#file{display:none}

body{background:#0d1729}header{background:linear-gradient(115deg,#083f37,#0c2337 78%);padding:19px 19px 16px;text-align:center;border-bottom:1px solid #244350}header strong{font-size:19px;letter-spacing:.2px}main{padding-top:14px}.card{background:#1c293e;border:1px solid #26354d;box-shadow:0 5px 18px #07102133;border-radius:16px}.balance{background:linear-gradient(135deg,#0b5448,#12273f 95%);text-align:center;padding:21px 15px 18px}.balance .big{font-size:clamp(29px,8vw,40px);margin:5px 0 17px}.balance small{letter-spacing:.4px}.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:16px 0 0}.statcard{background:#1c293e;border-radius:14px;padding:14px 10px;display:flex;align-items:center;gap:8px;min-width:0}.statcard .statIcon{display:grid;place-items:center;flex-shrink:0;border-radius:50%;background:#1c594d;width:32px;height:32px;color:#56edb0;font-size:20px}.statcard.out .statIcon{background:#574047;color:#ff987d}.statcard small{display:block;font-size:12px}.statcard strong{font-size:15px;white-space:nowrap}.primaryHero{width:100%;display:flex;justify-content:flex-start;align-items:center;gap:13px;text-align:left;background:#26354c;border-radius:13px;margin:2px 0 13px;font-weight:700}.primaryHero .plus{background:#315778;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;font-size:24px}.dashboardChart{display:flex;align-items:center;gap:12px}.dashboardChart .plot{width:132px;height:132px;flex:0 0 132px;margin:10px 0}.dashboardChart .plot span{width:78px;height:78px}.dashboardChart .legend{flex:1;display:block}.dashboardChart .legend div{margin:9px 0;font-size:12px}.urgent{display:flex;justify-content:space-between;align-items:center;background:#392937;padding:12px;border-radius:12px;margin-bottom:12px;gap:12px}.urgent .bad{font-weight:bold}nav{border-top:1px solid #2d3d54}nav button.on{color:#43daa5}
</style></head><body><header><strong>Mis Gastos Chile</strong><br><small>Tus finanzas, bajo control</small></header><main id="app"></main><nav id="nav"></nav><div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div><input type="file" id="file" accept=".json"><script>
'use strict';
const KEY='mis_gastos_chile_capacitor_v2',cats=['Luz','Agua','Gas','Internet','Plan celular','Arriendo','Dividendo','Contribuciones','Bencina','Diésel','Parafina','Supermercado','Alimentación','Transporte','Salud','Educación','Crédito','Tarjeta','Otros'],icons={'Luz':'⚡','Agua':'💧','Gas':'🔥','Internet':'🌐','Plan celular':'📱','Bencina':'⛽','Diésel':'⛽','Parafina':'🛢️','Supermercado':'🛒','Sueldo':'💰'},groups=['Servicios','Alimentación','Transporte','Vivienda','Otros'],colors=['#539dff','#46dba5','#ad95f8','#f1b26c','#ff8791'];
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),today=()=>iso(new Date()),id=()=>Date.now()+'-'+Math.random().toString(36).slice(2),money=n=>(db.currency==='CLP'?'$':db.currency+' ')+Math.round(n||0).toLocaleString('es-CL'),paid=x=>(x.payments||[]).reduce((a,p)=>a+Number(p.amount||0),0),owed=x=>Math.max(0,x.amount-paid(x)),state=x=>x.type!=='bill'?'':owed(x)===0?'Pagada':x.due<today()?'Vencida':'Pendiente',group=c=>['Luz','Agua','Gas','Internet','Plan celular'].includes(c)?0:['Supermercado','Alimentación'].includes(c)?1:['Bencina','Diésel','Parafina','Transporte'].includes(c)?2:['Arriendo','Dividendo','Contribuciones'].includes(c)?3:4;
let db={budget:0,currency:'CLP',items:[]},tab='inicio',filter='Pendientes',month=new Date(new Date().getFullYear(),new Date().getMonth(),1),editing=null;
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Array.isArray(saved.items))db=saved}catch(e){}
const persist=()=>localStorage.setItem(KEY,JSON.stringify(db)),thisMonth=d=>String(d||'').slice(0,7)===iso(month).slice(0,7);
function totals(){let income=0,expenses=0,pending=0,late=0;for(const x of db.items){if(x.type==='income'&&thisMonth(x.date))income+=x.amount;if(x.type==='expense'&&thisMonth(x.date))expenses+=x.amount;if(x.type==='bill'){pending+=owed(x);if(state(x)==='Vencida')late+=owed(x);for(const p of x.payments||[])if(thisMonth(p.date))expenses+=p.amount}}return{income,expenses,pending,late}}
function monthbar(){return '<div class="toolbar"><button onclick="changeMonth(-1)">‹</button><b>'+esc(new Intl.DateTimeFormat('es-CL',{month:'long',year:'numeric'}).format(month))+'</b><button onclick="changeMonth(1)">›</button></div>'}
function changeMonth(n){month=new Date(month.getFullYear(),month.getMonth()+n,1);render()}
function list(items){return items.length?items.map(x=>'<div class="line" data-id="'+esc(x.id)+'"><div class="ico">'+(icons[x.category]||'💳')+'</div><div class="detail"><strong>'+esc(x.category)+'</strong><small>'+esc((x.type==='bill'?'Vence '+x.due:x.date)+(x.note?' · '+x.note:''))+'</small>'+(x.type==='bill'?'<span class="tag '+(state(x)==='Vencida'?'late':'')+'">'+state(x)+'</span>':'')+'</div><span class="amount '+(x.type==='income'?'positive':state(x)==='Vencida'?'bad':'')+'">'+(x.type==='income'?'+':'−')+money(x.type==='bill'?owed(x):x.amount)+'</span></div>').join(''):'<div class="empty">No hay registros todavía.</div>'}
function bills(f='Pendientes',n=999){return db.items.filter(x=>x.type==='bill'&&(f==='Todas'||f==='Pendientes'&&owed(x)>0||f==='Vencidas'&&state(x)==='Vencida'||f==='Pagadas'&&owed(x)===0)).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,n)}
function summary(){const t=totals(),recent=db.items.filter(x=>x.type!=='bill'&&thisMonth(x.date)).sort((a,b)=>b.date.localeCompare(a.date));let v=[0,0,0,0,0];for(const x of db.items){if(x.type==='expense'&&thisMonth(x.date))v[group(x.category)]+=x.amount;if(x.type==='bill')for(const p of x.payments||[])if(thisMonth(p.date))v[group(x.category)]+=p.amount}let angle=0,gradient=v.map((n,i)=>{let a=angle;angle+=n/(t.expenses||1)*360;return n?colors[i]+' '+a+'deg '+angle+'deg':''}).filter(Boolean).join(',');return monthbar()+'<section class="card balance"><small>Saldo total disponible del mes</small><strong class="big">'+money(t.income-t.expenses)+'</strong><div class="statgrid"><div class="statcard"><div class="statIcon">↑</div><div style="text-align:left"><small>Ingresos</small><strong>'+money(t.income)+'</strong></div></div><div class="statcard out"><div class="statIcon">↓</div><div style="text-align:left"><small>Gastos</small><strong>'+money(t.expenses)+'</strong></div></div></div></section><button class="btn primaryHero" onclick="openEntryForm(\'expense\')"><span class="plus">＋</span>Añadir Gasto / Ingreso</button><section class="card"><h2>Gráfico visual</h2><div class="dashboardChart"><div class="plot" style="background:'+(gradient?'conic-gradient('+gradient+')':'#35445c')+'"><span>'+money(t.expenses)+'</span></div><div class="legend">'+groups.map((n,i)=>'<div><i class="dot" style="background:'+colors[i]+'"></i>'+n+' · '+(t.expenses?Math.round(v[i]/t.expenses*100):0)+'%</div>').join('')+'</div></div></section><section class="card"><h2>Cuentas por pagar</h2><div class="urgent"><span><strong>'+money(t.pending)+'</strong><br><small>Saldo pendiente</small></span><span class="bad">Vencidas<br>'+money(t.late)+'</span></div>'+list(bills('Pendientes',3))+'<button class="btn primary full" onclick="openEntryForm(\'bill\')">＋ Registrar cuenta de luz, agua, gas...</button></section><section class="card"><h2>Lista de últimos movimientos</h2>'+list(recent.slice(0,6))+'</section>'}
function accounts(){let t=totals();return '<section class="card"><h2>Cuentas por pagar</h2><small>Total pendiente</small><div class="big positive" style="font-size:29px;font-weight:bold">'+money(t.pending)+'</div><b class="bad">Atrasadas: '+money(t.late)+'</b></section><button class="btn primary full" onclick="openEntryForm(\'bill\')">＋ Registrar cuenta, incluso vencida</button><div class="filters">'+['Pendientes','Vencidas','Pagadas','Todas'].map(f=>'<button class="'+(filter===f?'on':'')+'" data-filter="'+f+'">'+f+'</button>').join('')+'</div><section class="card">'+list(bills(filter))+'</section>'}
function movements(){let arr=db.items.filter(x=>x.type!=='bill');for(const x of db.items.filter(x=>x.type==='bill'))for(const p of x.payments||[])arr.push({...x,type:'expense',date:p.date,amount:p.amount,note:'Abono · '+x.note});return '<section class="card"><div class="row"><h2>Movimientos</h2><button onclick="openEntryForm(\'expense\')">＋ Gasto</button></div>'+list(arr.sort((a,b)=>b.date.localeCompare(a.date)))+'</section>'}
function stats(){let t=totals(),v=[0,0,0,0,0];for(const x of db.items){if(x.type==='expense'&&thisMonth(x.date))v[group(x.category)]+=x.amount;for(const p of x.payments||[])if(thisMonth(p.date))v[group(x.category)]+=p.amount}let angle=0,gradient=v.map((n,i)=>{let a=angle;angle+=n/(t.expenses||1)*360;return n?colors[i]+' '+a+'deg '+angle+'deg':''}).filter(Boolean).join(',');return monthbar()+'<section class="card"><h2>Distribución de gastos</h2><div class="plot" style="background:'+(gradient?'conic-gradient('+gradient+')':'#35445c')+'"><span>'+money(t.expenses)+'</span></div><div class="legend">'+groups.map((n,i)=>'<div><i class="dot" style="background:'+colors[i]+'"></i>'+n+': '+(t.expenses?Math.round(v[i]/t.expenses*100):0)+'%</div>').join('')+'</div></section>'}
function settings(){return '<section class="card"><h2>Mis datos</h2><p class="muted">Todos los ingresos, gastos, cuentas y pagos se guardan en este teléfono.</p><button class="btn full" onclick="csv()">📄 Exportar movimientos a Excel (CSV)</button></section><section class="card"><h2>Protege tus registros</h2><p class="muted">Guarda una copia de seguridad antes de cambiar de celular o reinstalar la aplicación.</p><button class="btn primary full" onclick="backup()">💾 Guardar copia de seguridad</button><br><br><button class="btn full" onclick="$(\'file\').click()">📂 Recuperar copia de seguridad</button><small class="muted" style="display:block;margin-top:10px">La copia conserva cuentas, abonos y movimientos; al recuperarla reemplaza los datos actuales. Se guarda como un archivo JSON, que no necesitas abrir ni editar.</small></section>'}
function render(){$('app').innerHTML=({inicio:summary,cuentas:accounts,movimientos:movements,estadisticas:stats,ajustes:settings}[tab])();$('nav').innerHTML=[['inicio','🏠','Inicio'],['cuentas','📅','Cuentas'],['movimientos','📋','Movimientos'],['estadisticas','📊','Gráficos'],['ajustes','⚙','Ajustes']].map(([x,i,t])=>'<button data-tab="'+x+'" class="'+(x===tab?'on':'')+'"><b>'+i+'</b>'+t+'</button>').join('');document.querySelectorAll('[data-tab]').forEach(n=>n.onclick=()=>{tab=n.dataset.tab;render()});document.querySelectorAll('[data-id]').forEach(n=>n.onclick=()=>detail(n.dataset.id));document.querySelectorAll('[data-filter]').forEach(n=>n.onclick=()=>{filter=n.dataset.filter;render()})}
function modal(html){$('sheet').innerHTML=html;$('overlay').classList.add('on')}function dismissSheet(){editing=null;$('overlay').classList.remove('on')}
function backInApp(){if($('overlay').classList.contains('on')){dismissSheet();return true}if(tab!=='inicio'){tab='inicio';render();return true}return false}
$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))dismissSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'||(e.key==='Backspace'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))){if(backInApp())e.preventDefault()}});
window.addEventListener('popstate',()=>{backInApp()});
function registerAndroidBack(){try{const cap=window.Capacitor;const app=cap?.Plugins?.App || (cap?.registerPlugin ? cap.registerPlugin('App') : null);if(app&&app.addListener){app.addListener('backButton',()=>{if(!backInApp())app.exitApp&&app.exitApp()});return true}}catch(e){console.warn('Android back registration',e)}return false}
if(!registerAndroidBack())window.addEventListener('load',registerAndroidBack);
function openEntryForm(type='expense',key=null){const x=db.items.find(z=>z.id===key);editing=key;modal('<div class="row"><h2>'+(x?'Editar':'Nuevo')+' registro</h2><button onclick="dismissSheet()">×</button></div><label>Tipo</label><select id="type" onchange="switchType()"><option value="bill">Cuenta por pagar</option><option value="expense">Gasto pagado</option><option value="income">Ingreso</option></select><label>Categoría</label><select id="cat">'+[...cats,'Sueldo','Ventas','Honorarios'].map(v=>'<option>'+v+'</option>').join('')+'</select><label>Monto</label><input id="amt" type="number" min="1" placeholder="Ejemplo: 48000"><label>Empresa o detalle</label><input id="note" placeholder="Ej: Enel · noviembre"><label>Fecha</label><input id="date" type="date"><div id="billfields"><label>Fecha de vencimiento (también fechas pasadas)</label><input id="due" type="date"><label>Ya pagada <input id="fully" type="checkbox"></label></div><div class="error" id="err"></div><br><button class="btn primary full" onclick="save()">Guardar</button>');$('type').value=x?.type||type;$('cat').value=x?.category||(type==='income'?'Sueldo':type==='bill'?'Luz':'Bencina');$('amt').value=x?.amount||'';$('note').value=x?.note||'';$('date').value=x?.date||today();$('due').value=x?.due||today();$('fully').checked=!!(x&&x.type==='bill'&&owed(x)===0);switchType()}
function switchType(){$('billfields').style.display=$('type').value==='bill'?'block':'none'}
function save(){let type=$('type').value,amount=Math.round(Number($('amt').value)),date=$('date').value,due=type==='bill'?$('due').value:'';if(!Number.isSafeInteger(amount)||amount<=0||!date||(type==='bill'&&!due)){$('err').textContent='Completa el monto y las fechas correctamente.';return}const old=db.items.find(x=>x.id===editing);if(old&&type==='bill'&&paid(old)>amount){$('err').textContent='El monto es menor a los abonos existentes.';return}let x={id:old?.id||id(),type,amount,date,due,category:$('cat').value,note:$('note').value.trim(),payments:type==='bill'&&old?.type==='bill'?[...old.payments]:[]};if(type==='bill'&&$('fully').checked&&owed(x)>0)x.payments.push({id:id(),date,amount:owed(x),method:'Pago total'});if(old)db.items[db.items.indexOf(old)]=x;else db.items.push(x);persist();dismissSheet();render()}
function detail(key){const x=db.items.find(z=>z.id===key);if(!x)return;modal('<div class="row"><h2>'+esc(x.category)+'</h2><button onclick="dismissSheet()">×</button></div><h2>'+money(x.amount)+'</h2><p class="muted">'+esc(x.note)+'</p>'+(x.type==='bill'?'<p>Vence: '+esc(x.due)+'<br>Pagado: '+money(paid(x))+'<br>Saldo: '+money(owed(x))+'</p><h2>Abonos</h2>'+(x.payments||[]).map(p=>'<p>'+esc(p.date)+' · '+esc(p.method)+' · '+money(p.amount)+'</p>').join(''):'')+'<div class="actions">'+(x.type==='bill'&&owed(x)>0?'<button class="btn primary" onclick="payment(\''+esc(key)+'\')">Pagar / abonar</button>':'')+'<button class="btn" onclick="openEntryForm(\''+x.type+'\',\''+esc(key)+'\')">Editar</button><button class="btn" onclick="remove(\''+esc(key)+'\')">Eliminar</button></div>')}
function payment(key){let x=db.items.find(z=>z.id===key);if(!x)return;modal('<div class="row"><h2>Abonar '+esc(x.category)+'</h2><button onclick="dismissSheet()">×</button></div><p>Saldo por pagar: '+money(owed(x))+'</p><label>Monto abonado</label><input id="payAmt" type="number" min="1" max="'+owed(x)+'" value="'+owed(x)+'"><label>Fecha</label><input id="payDate" type="date" value="'+today()+'"><label>Medio de pago</label><select id="method"><option>Transferencia</option><option>Débito</option><option>Crédito</option><option>Efectivo</option></select><div class="error" id="err"></div><br><button class="btn primary full" onclick="savePayment(\''+esc(key)+'\')">Confirmar abono</button>')}
function savePayment(key){let x=db.items.find(z=>z.id===key),v=Number($('payAmt').value),date=$('payDate').value;if(!x||!Number.isSafeInteger(v)||v<=0||v>owed(x)||!date){$('err').textContent='Monto o fecha inválidos.';return}x.payments.push({id:id(),amount:v,date,method:$('method').value});persist();dismissSheet();render()}
function remove(key){if(confirm('¿Eliminar el registro y todos sus pagos?')){db.items=db.items.filter(x=>x.id!==key);persist();dismissSheet();render()}}

function download(name,content,mime){let url=URL.createObjectURL(new Blob([content],{type:mime})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function backup(){download('Mis_Gastos_Respaldo_'+today()+'.json',JSON.stringify({schema:2,data:db},null,2),'application/json')}
function csv(){let out=[['Fecha','Tipo','Categoría','Monto','Detalle','Vencimiento','Estado','Saldo']];for(let x of db.items){out.push([x.date,x.type,x.category,x.amount,x.note,x.due,state(x),x.type==='bill'?owed(x):'']);for(let p of x.payments||[])out.push([p.date,'abono',x.category,p.amount,p.method,x.due,'',''])}download('Mis_Gastos_'+today()+'.csv','\ufeff'+out.map(row=>row.map(z=>'"'+String(z??'').replace(/"/g,'""')+'"').join(';')).join('\r\n'),'text/csv;charset=utf-8')}
$('file').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let obj=JSON.parse(await file.text()),d=obj.data||obj;if(!Array.isArray(d.items))throw Error('Archivo no compatible');if(confirm('¿Reemplazar todos los registros con el respaldo?')){db=d;persist();render()}}catch(err){alert(err.message)}e.target.value=''};render();

/* MEJORAS V1.2 — comprobantes locales, exportación móvil y respaldo íntegro */
let selectedReceipt=null;
const receiptsDB=()=>new Promise((resolve,reject)=>{
  const req=indexedDB.open('mis-gastos-comprobantes-v1',1);
  req.onupgradeneeded=()=>req.result.createObjectStore('archivos');
  req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
});
async function receiptStore(key,blob){
  const d=await receiptsDB();
  try{await new Promise((resolve,reject)=>{const t=d.transaction('archivos','readwrite');t.objectStore('archivos').put(blob,key);t.oncomplete=resolve;t.onerror=()=>reject(t.error);});}
  finally{d.close();}
}
async function receiptRead(key){
  const d=await receiptsDB();
  try{return await new Promise((resolve,reject)=>{const t=d.transaction('archivos','readonly'),q=t.objectStore('archivos').get(key);q.onsuccess=()=>resolve(q.result||null);q.onerror=()=>reject(q.error);});}
  finally{d.close();}
}
async function receiptDelete(key){
  const d=await receiptsDB();
  try{await new Promise((resolve,reject)=>{const t=d.transaction('archivos','readwrite');t.objectStore('archivos').delete(key);t.oncomplete=resolve;t.onerror=()=>reject(t.error);});}
  finally{d.close();}
}
const receiptMaxSize=8*1024*1024;
function receiptControls(){
  const sheet=$('sheet');
  const holder=document.createElement('div');
  holder.innerHTML='<label for="receiptPick">📎 Comprobante (fotografía o PDF, opcional)</label><input type="file" id="receiptPick" accept="image/jpeg,image/png,image/webp,application/pdf,image/*" style="color:#fff"><small id="receiptHelp" style="display:block;margin-top:8px">Puedes adjuntar una boleta, factura o comprobante de transferencia, hasta 8 MB.</small>';
  const saveButton=sheet.querySelector('button[onclick="save()"]');
  if(saveButton)saveButton.before(holder);else sheet.append(holder);
  const input=$('receiptPick');
  input.addEventListener('change',()=>{
    const file=input.files&&input.files[0];
    selectedReceipt=null;
    if(!file)return;
    const valid=file.type==='application/pdf'||file.type.startsWith('image/');
    if(!valid||file.size>receiptMaxSize){
      alert('Solo fotos o PDF de hasta 8 MB. Elige otro archivo.');
      input.value='';return;
    }
    selectedReceipt=file;
    $('receiptHelp').textContent='Seleccionado: '+file.name;
  });
}
const basicOpenEntryForm=openEntryForm;
openEntryForm=function(type='expense',key=null){
  selectedReceipt=null;basicOpenEntryForm(type,key);
  receiptControls();
  const dropdown=$('type'),category=$('cat');
  function filterCategories(){
    const selected=category.value,kind=dropdown.value;
    const names=kind==='income'?['Sueldo','Honorarios','Ventas','Otros']:
     ['Luz','Agua','Gas','Internet','Plan celular','Arriendo','Dividendo','Contribuciones','Bencina','Diésel','Parafina','Supermercado','Alimentación','Transporte','Salud','Educación','Crédito','Tarjeta','Otros'];
    category.replaceChildren();
    for(const name of names){const op=document.createElement('option');op.value=name;op.textContent=name;category.append(op);}
    category.value=names.includes(selected)?selected:kind==='income'?'Sueldo':kind==='bill'?'Luz':'Supermercado';
  }
  dropdown.addEventListener('change',filterCategories);
  filterCategories();
};
const basicSave=save;
save=async function(){
  const priorId=editing, prior=priorId?db.items.find(x=>x.id===priorId):null;
  if(prior&&prior.type==='bill'&&paid(prior)>0&&$('type').value!=='bill'){
    $('err').textContent='Esta cuenta tiene abonos. No puedes cambiarla a ingreso o gasto sin perder el historial.';return;
  }
  const before=new Set(db.items.map(x=>x.id)), file=selectedReceipt;
  basicSave();
  if($('overlay').classList.contains('on'))return;
  const item=priorId?db.items.find(x=>x.id===priorId):db.items.find(x=>!before.has(x.id));
  selectedReceipt=null;
  if(!item||!file)return;
  try{
    await receiptStore(item.id,file);
    item.receipt={name:file.name,mime:file.type,size:file.size};
    persist();render();
    alert('Registro y comprobante guardados correctamente.');
  }catch(error){alert('Guardé el movimiento, pero no pude guardar el comprobante. Revisa el espacio disponible en el teléfono.');}
};
const basicDetail=detail;
detail=function(key){
  basicDetail(key);const item=db.items.find(x=>x.id===key);if(!item)return;
  const actions=$('sheet').querySelector('.actions');if(!actions)return;
  const add=document.createElement('button');add.className='btn';add.textContent=item.receipt?'📎 Cambiar comprobante':'📎 Adjuntar comprobante';
  add.onclick=()=>{
    const picker=document.createElement('input');picker.type='file';picker.accept='image/*,application/pdf';
    picker.onchange=async()=>{
      const file=picker.files&&picker.files[0];if(!file)return;
      if(!(file.type==='application/pdf'||file.type.startsWith('image/'))||file.size>receiptMaxSize){alert('Usa una imagen o un PDF de hasta 8 MB.');return;}
      try{await receiptStore(item.id,file);item.receipt={name:file.name,mime:file.type,size:file.size};persist();detail(key);}
      catch(e){alert('No se pudo guardar el comprobante.');}
    };picker.click();
  };actions.append(add);
  if(item.receipt){
    const see=document.createElement('button');see.className='btn primary';see.textContent='👁 Ver comprobante';
    see.onclick=()=>showReceipt(key);actions.append(see);
  }
};
async function showReceipt(key){
  const item=db.items.find(x=>x.id===key),blob=await receiptRead(key);
  if(!blob){alert('No se encontró el comprobante en este teléfono.');return;}
  if(blob.type.startsWith('image/')){
    const url=URL.createObjectURL(blob);
    modal('<div class="row"><h2>Comprobante</h2><button onclick="dismissSheet()">×</button></div><p class="muted">'+esc(item?.receipt?.name||'Fotografía')+'</p><img id="receiptPreview" alt="Comprobante" style="width:100%;height:auto;max-height:65vh;object-fit:contain;border-radius:12px"><br><br><button class="btn full" id="shareReceipt">Compartir o guardar comprobante</button>');
    $('receiptPreview').src=url;
    $('receiptPreview').onload=()=>setTimeout(()=>URL.revokeObjectURL(url),30000);
    $('shareReceipt').onclick=()=>shareMobile(item.receipt.name,blob,blob.type);
  }else await shareMobile(item?.receipt?.name||'comprobante.pdf',blob,'application/pdf');
}
const basicRemove=remove;
remove=function(key){
  if(!confirm('¿Eliminar este movimiento, sus abonos y su comprobante? Esta acción no se puede deshacer.'))return;
  db.items=db.items.filter(x=>x.id!==key);persist();dismissSheet();render();
  receiptDelete(key).catch(()=>{});
};
function blobDataUrl(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(blob);});}
function dataUrlBlob(data){
  const parts=data.split(','),mime=/data:(.*?);/.exec(parts[0])?.[1]||'application/octet-stream',binary=atob(parts[1]||''),bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);return new Blob([bytes],{type:mime});
}
async function shareMobile(filename,blob,mime){
  try{
    const cap=window.Capacitor;
    const fs=cap?.Plugins?.Filesystem||(cap?.registerPlugin?cap.registerPlugin('Filesystem'):null);
    const share=cap?.Plugins?.Share||(cap?.registerPlugin?cap.registerPlugin('Share'):null);
    if(fs&&share){
      const data=await blobDataUrl(blob),safe=filename.replace(/[^A-Za-z0-9_.-]/g,'_');
      const path='exportaciones/'+Date.now()+'_'+safe;
      await fs.writeFile({path,data:data.split(',')[1],directory:'CACHE',recursive:true});
      const uri=await fs.getUri({path,directory:'CACHE'});
      await share.share({title:'Mis Gastos Chile',url:uri.uri,dialogTitle:'Abrir, compartir o guardar archivo'});
      return;
    }
  }catch(error){console.warn('No se pudo abrir el menú para compartir',error);}
  const uri=URL.createObjectURL(blob),a=document.createElement('a');a.href=uri;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(uri),10000);
}
csv=async function(){
  const out=[['Fecha','Tipo','Categoría','Monto','Detalle','Vencimiento','Estado','Saldo pendiente','Comprobante']];
  for(const x of db.items){
    out.push([x.date,x.type,x.category,x.amount,x.note||'',x.due||'',state(x),x.type==='bill'?owed(x):'',x.receipt?.name||'']);
    for(const p of x.payments||[])out.push([p.date,'Abono',x.category,p.amount,p.method||'',x.due||'','Pagado','','']);
  }
  const content='\ufeff'+out.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');
  await shareMobile('Mis_Gastos_'+today()+'.csv',new Blob([content],{type:'text/csv;charset=utf-8'}),'text/csv');
};
backup=async function(){
  const attachments={};
  try{
    for(const item of db.items){if(item.receipt){const blob=await receiptRead(item.id);if(blob)attachments[item.id]=await blobDataUrl(blob);}}
    const data=JSON.stringify({schema:3,data:db,attachments});
    await shareMobile('Respaldo_Mis_Gastos_'+today()+'.json',new Blob([data],{type:'application/json'}),'application/json');
  }catch(e){alert('No se pudo preparar la copia completa. Revisa el espacio disponible.');}
};
$('file').onchange=async e=>{
  const file=e.target.files?.[0];if(!file)return;
  try{
    const record=JSON.parse(await file.text()),next=record.data||record;
    if(!Array.isArray(next.items))throw Error('Este archivo no es un respaldo válido de Mis Gastos.');
    if(!confirm('¿Recuperar esta copia? Se reemplazarán todos los registros actuales.'))return;
    if(record.attachments){
      for(const [key,data] of Object.entries(record.attachments))await receiptStore(key,dataUrlBlob(data));
    }
    db=next;persist();render();alert('Datos recuperados correctamente.');
  }catch(err){alert('No se pudo recuperar el respaldo: '+err.message);}
  finally{e.target.value='';}
};

</script></body></html>
