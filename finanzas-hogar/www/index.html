<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mis Gastos Chile</title><style>
:root{color-scheme:dark;--bg:#0b1729;--card:#1b2940;--line:#33435d;--mint:#43daa5;--muted:#acbbcf;--red:#ff8587}*{box-sizing:border-box}body{margin:0;font:15px system-ui,-apple-system,sans-serif;background:var(--bg);color:white}header{padding:20px 18px 8px}header strong{font-size:22px}small,.muted{color:var(--muted)}main{padding:10px 14px 115px;max-width:620px;margin:auto}.card{background:var(--card);padding:17px;border-radius:19px;margin-bottom:13px}.balance{background:linear-gradient(135deg,#184a4a,#162b4b)}.balance .big{font-size:33px;color:var(--mint);display:block;margin:9px 0;font-weight:800}h2{font-size:18px;margin:0 0 12px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.row>*{min-width:0}.positive{color:var(--mint)}.bad{color:var(--red)}.line{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding:13px 0;cursor:pointer}.line .ico{font-size:25px;width:36px}.line .detail{flex:1;min-width:0}.line .detail strong{display:block}.line .detail small{display:block;white-space:normal}.line .amount{font-weight:700;white-space:nowrap}.tag{font-size:11px;padding:2px 7px;border-radius:12px;background:#354961;display:inline-block;margin-top:5px}.tag.late{background:#612d3a;color:#ffb8b9}.actions,.filters{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0}.btn,button{border:0;border-radius:12px;padding:12px;color:white;background:#34445e;font:inherit;cursor:pointer}.btn.primary{background:#147f66;font-weight:700}.actions>.btn{flex:1;min-width:135px}.full{width:100%}.filters button.on{background:#147f66}nav{position:fixed;bottom:0;left:0;right:0;background:#142239;display:flex;padding:9px 3px max(10px,env(safe-area-inset-bottom));box-shadow:0 -8px 25px #061020b0}nav button{flex:1;font-size:11px;padding:7px 2px;background:transparent;color:var(--muted)}nav button.on{color:var(--mint)}nav button b{display:block;font-size:20px}label{display:block;color:var(--muted);margin:13px 0 5px;font-size:13px}input,select{width:100%;padding:13px;border:1px solid #435774;background:#0f1c30;color:white;border-radius:10px;font:inherit}input[type=checkbox]{width:auto}.overlay{display:none;position:fixed;inset:0;z-index:4;background:#030914bb;align-items:end}.overlay.on{display:flex}.sheet{background:#1b2940;border-radius:22px 22px 0 0;padding:20px;width:100%;max-height:92vh;overflow:auto}.sheet h2{margin:0}.sheet .row{margin-bottom:10px}.plot{width:140px;height:140px;border-radius:50%;margin:14px auto;background:#35445c;display:grid;place-items:center}.plot span{width:85px;height:85px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;font-size:12px}.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px}.legend div{font-size:12px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}.progress{height:9px;background:#33435d;border-radius:10px;overflow:hidden;margin:12px 0}.progress div{background:var(--mint);height:100%}.empty{color:var(--muted);padding:13px 0}.toolbar{display:flex;align-items:center;justify-content:center;gap:25px;margin-bottom:12px}.toolbar button{font-size:23px;padding:4px 12px}.error{color:var(--red);margin-top:8px}#file{display:none}
</style><style>
body{background:#0d1729}header{background:linear-gradient(115deg,#083f37,#0c2337 78%);padding:19px 19px 16px;text-align:center;border-bottom:1px solid #244350}header strong{font-size:19px;letter-spacing:.2px}main{padding-top:14px}.card{background:#1c293e;border:1px solid #26354d;box-shadow:0 5px 18px #07102133;border-radius:16px}.balance{background:linear-gradient(135deg,#0b5448,#12273f 95%);text-align:center;padding:21px 15px 18px}.balance .big{font-size:clamp(29px,8vw,40px);margin:5px 0 17px}.balance small{letter-spacing:.4px}.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:16px 0 0}.statcard{background:#1c293e;border-radius:14px;padding:14px 10px;display:flex;align-items:center;gap:8px;min-width:0}.statcard .statIcon{display:grid;place-items:center;flex-shrink:0;border-radius:50%;background:#1c594d;width:32px;height:32px;color:#56edb0;font-size:20px}.statcard.out .statIcon{background:#574047;color:#ff987d}.statcard small{display:block;font-size:12px}.statcard strong{font-size:15px;white-space:nowrap}.primaryHero{width:100%;display:flex;justify-content:flex-start;align-items:center;gap:13px;text-align:left;background:#26354c;border-radius:13px;margin:2px 0 13px;font-weight:700}.primaryHero .plus{background:#315778;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;font-size:24px}.dashboardChart{display:flex;align-items:center;gap:12px}.dashboardChart .plot{width:132px;height:132px;flex:0 0 132px;margin:10px 0}.dashboardChart .plot span{width:78px;height:78px}.dashboardChart .legend{flex:1;display:block}.dashboardChart .legend div{margin:9px 0;font-size:12px}.urgent{display:flex;justify-content:space-between;align-items:center;background:#392937;padding:12px;border-radius:12px;margin-bottom:12px;gap:12px}.urgent .bad{font-weight:bold}nav{border-top:1px solid #2d3d54}nav button.on{color:#43daa5}
</style></head><body><header><strong>Mis Gastos Chile</strong><br><small>Tus finanzas, bajo control</small></header><main id="app"></main><nav id="nav"></nav><div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div><input type="file" id="file" accept=".json"><script>
'use strict';
const KEY='mis_gastos_chile_capacitor_v2',cats=['Luz','Agua','Gas','Internet','Plan celular','Arriendo','Dividendo','Contribuciones','Bencina','Diésel','Parafina','Supermercado','Alimentación','Transporte','Salud','Educación','Crédito','Tarjeta','Otros'],icons={'Luz':'⚡','Agua':'💧','Gas':'🔥','Internet':'🌐','Plan celular':'📱','Bencina':'⛽','Diésel':'⛽','Parafina':'🛢️','Supermercado':'🛒','Sueldo':'💰'},groups=['Servicios','Alimentación','Transporte','Vivienda','Otros'],colors=['#539dff','#46dba5','#ad95f8','#f1b26c','#ff8791'];
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),today=()=>iso(new Date()),id=()=>Date.now()+'-'+Math.random().toString(36).slice(2),money=n=>(db.currency==='CLP'?'$':db.currency+' ')+Math.round(n||0).toLocaleString('es-CL'),paid=x=>(x.payments||[]).reduce((a,p)=>a+Number(p.amount||0),0),owed=x=>Math.max(0,x.amount-paid(x)),state=x=>x.type!=='bill'?'':owed(x)===0?'Pagada':x.due<today()?'Vencida':'Pendiente',group=c=>['Luz','Agua','Gas','Internet','Plan celular'].includes(c)?0:['Supermercado','Alimentación'].includes(c)?1:['Bencina','Diésel','Parafina','Transporte'].includes(c)?2:['Arriendo','Dividendo','Contribuciones'].includes(c)?3:4;
let db={budget:0,currency:'CLP',items:[]},tab='inicio',filter='Pendientes',month=new Date(new Date().getFullYear(),new Date().getMonth(),1),editing=null;
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Array.isArray(saved.items))db=saved}catch(e){}
const persist=()=>localStorage.setItem(KEY,JSON.stringify(db)),thisMonth=d=>String(d||'').slice(0,7)===iso(month).slice(0,7);
function totals(){let income=0,expenses=0,pending=0,late=0;for(const x of db.items){if(x.type==='income'&&thisMonth(x.date))income+=x.amount;if(x.type==='expense'&&thisMonth(x.date))expenses+=x.amount;if(x.type==='bill'){pending+=owed(x);if(state(x)==='Vencida')late+=owed(x);for(const p of x.payments||[])if(thisMonth(p.date))expenses+=p.amount}}return{income,expenses,pending,late}}
function monthbar(){return '<div class="toolbar"><button onclick="changeMonth(-1)">‹</button><b>'+esc(new Intl.DateTimeFormat('es-CL',{month:'long',year:'numeric'}).format(month))+'</b><button onclick="changeMonth(1)">›</button></div>'}
function changeMonth(n){month=new Date(month.getFullYear(),month.getMonth()+n,1);render()}
function list(items){return items.length?items.map(x=>'<div class="line" data-id="'+esc(x.id)+'"><div class="ico">'+(icons[x.category]||'💳')+'</div><div class="detail"><strong>'+esc(x.category)+'</strong><small>'+esc((x.type==='bill'?'Vence '+x.due:x.date)+(x.note?' · '+x.note:''))+'</small>'+(x.type==='bill'?'<span class="tag '+(state(x)==='Vencida'?'late':'')+'">'+state(x)+'</span>':'')+'</div><span class="amount '+(x.type==='income'?'positive':state(x)==='Vencida'?'bad':'')+'">'+(x.type==='income'?'+':'−')+money(x.type==='bill'?owed(x):x.amount)+'</span></div>').join(''):'<div class="empty">No hay registros todavía.</div>'}
function bills(f='Pendientes',n=999){return db.items.filter(x=>x.type==='bill'&&(f==='Todas'||f==='Pendientes'&&owed(x)>0||f==='Vencidas'&&state(x)==='Vencida'||f==='Pagadas'&&owed(x)===0)).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,n)}
function summary(){const t=totals(),recent=db.items.filter(x=>x.type!=='bill'&&thisMonth(x.date)).sort((a,b)=>b.date.localeCompare(a.date));let v=[0,0,0,0,0];for(const x of db.items){if(x.type==='expense'&&thisMonth(x.date))v[group(x.category)]+=x.amount;if(x.type==='bill')for(const p of x.payments||[])if(thisMonth(p.date))v[group(x.category)]+=p.amount}let angle=0,gradient=v.map((n,i)=>{let a=angle;angle+=n/(t.expenses||1)*360;return n?colors[i]+' '+a+'deg '+angle+'deg':''}).filter(Boolean).join(',');return monthbar()+'<section class="card balance"><small>Saldo total disponible del mes</small><strong class="big">'+money(t.income-t.expenses)+'</strong><div class="statgrid"><div class="statcard"><div class="statIcon">↑</div><div style="text-align:left"><small>Ingresos</small><strong>'+money(t.income)+'</strong></div></div><div class="statcard out"><div class="statIcon">↓</div><div style="text-align:left"><small>Gastos</small><strong>'+money(t.expenses)+'</strong></div></div></div></section><button class="btn primaryHero" onclick="openEntryForm(\'expense\')"><span class="plus">＋</span>Añadir Gasto / Ingreso</button><section class="card"><h2>Gráfico visual</h2><div class="dashboardChart"><div class="plot" style="background:'+(gradient?'conic-gradient('+gradient+')':'#35445c')+'"><span>'+money(t.expenses)+'</span></div><div class="legend">'+groups.map((n,i)=>'<div><i class="dot" style="background:'+colors[i]+'"></i>'+n+' · '+(t.expenses?Math.round(v[i]/t.expenses*100):0)+'%</div>').join('')+'</div></div></section><section class="card"><h2>Cuentas por pagar</h2><div class="urgent"><span><strong>'+money(t.pending)+'</strong><br><small>Saldo pendiente</small></span><span class="bad">Vencidas<br>'+money(t.late)+'</span></div>'+list(bills('Pendientes',3))+'<button class="btn primary full" onclick="openEntryForm(\'bill\')">＋ Registrar cuenta de luz, agua, gas...</button></section><section class="card"><h2>Lista de últimos movimientos</h2>'+list(recent.slice(0,6))+'</section><section class="card"><h2>Presupuesto mensual</h2><small>'+money(t.expenses)+' de '+money(db.budget)+'</small><div class="progress"><div style="width:'+Math.min(100,db.budget?t.expenses/db.budget*100:0)+'%"></div></div></section>'}
function accounts(){let t=totals();return '<section class="card"><h2>Cuentas por pagar</h2><small>Total pendiente</small><div class="big positive" style="font-size:29px;font-weight:bold">'+money(t.pending)+'</div><b class="bad">Atrasadas: '+money(t.late)+'</b></section><button class="btn primary full" onclick="openEntryForm(\'bill\')">＋ Registrar cuenta, incluso vencida</button><div class="filters">'+['Pendientes','Vencidas','Pagadas','Todas'].map(f=>'<button class="'+(filter===f?'on':'')+'" data-filter="'+f+'">'+f+'</button>').join('')+'</div><section class="card">'+list(bills(filter))+'</section>'}
function movements(){let arr=db.items.filter(x=>x.type!=='bill');for(const x of db.items.filter(x=>x.type==='bill'))for(const p of x.payments||[])arr.push({...x,type:'expense',date:p.date,amount:p.amount,note:'Abono · '+x.note});return '<section class="card"><div class="row"><h2>Movimientos</h2><button onclick="openEntryForm(\'expense\')">＋ Gasto</button></div>'+list(arr.sort((a,b)=>b.date.localeCompare(a.date)))+'</section>'}
function stats(){let t=totals(),v=[0,0,0,0,0];for(const x of db.items){if(x.type==='expense'&&thisMonth(x.date))v[group(x.category)]+=x.amount;for(const p of x.payments||[])if(thisMonth(p.date))v[group(x.category)]+=p.amount}let angle=0,gradient=v.map((n,i)=>{let a=angle;angle+=n/(t.expenses||1)*360;return n?colors[i]+' '+a+'deg '+angle+'deg':''}).filter(Boolean).join(',');return monthbar()+'<section class="card"><h2>Distribución de gastos</h2><div class="plot" style="background:'+(gradient?'conic-gradient('+gradient+')':'#35445c')+'"><span>'+money(t.expenses)+'</span></div><div class="legend">'+groups.map((n,i)=>'<div><i class="dot" style="background:'+colors[i]+'"></i>'+n+': '+(t.expenses?Math.round(v[i]/t.expenses*100):0)+'%</div>').join('')+'</div></section>'}
function settings(){return '<section class="card"><h2>Presupuesto mensual</h2><input id="budget" type="number" min="0" value="'+Number(db.budget||0)+'"><button class="btn primary full" onclick="setBudget()">Guardar presupuesto</button></section><section class="card"><h2>Datos y respaldos</h2><p class="muted">Los datos se almacenan en el dispositivo. Guarda un respaldo antes de desinstalar.</p><button class="btn full" onclick="csv()">Exportar CSV (Excel)</button><br><br><button class="btn full" onclick="backup()">Guardar respaldo JSON</button><br><br><button class="btn full" onclick="$(\'file\').click()">Restaurar JSON</button></section>'}
function render(){$('app').innerHTML=({inicio:summary,cuentas:accounts,movimientos:movements,estadisticas:stats,ajustes:settings}[tab])();$('nav').innerHTML=[['inicio','🏠','Inicio'],['cuentas','📅','Cuentas'],['movimientos','📋','Movimientos'],['estadisticas','📊','Gráficos'],['ajustes','⚙','Ajustes']].map(([x,i,t])=>'<button data-tab="'+x+'" class="'+(x===tab?'on':'')+'"><b>'+i+'</b>'+t+'</button>').join('');document.querySelectorAll('[data-tab]').forEach(n=>n.onclick=()=>{tab=n.dataset.tab;render()});document.querySelectorAll('[data-id]').forEach(n=>n.onclick=()=>detail(n.dataset.id));document.querySelectorAll('[data-filter]').forEach(n=>n.onclick=()=>{filter=n.dataset.filter;render()})}
function modal(html){$('sheet').innerHTML=html;$('overlay').classList.add('on')}function close(){editing=null;$('overlay').classList.remove('on')}
function openEntryForm(type='expense',key=null){const x=db.items.find(z=>z.id===key);editing=key;modal('<div class="row"><h2>'+(x?'Editar':'Nuevo')+' registro</h2><button onclick="close()">×</button></div><label>Tipo</label><select id="type" onchange="switchType()"><option value="bill">Cuenta por pagar</option><option value="expense">Gasto pagado</option><option value="income">Ingreso</option></select><label>Categoría</label><select id="cat">'+[...cats,'Sueldo','Ventas','Honorarios'].map(v=>'<option>'+v+'</option>').join('')+'</select><label>Monto</label><input id="amt" type="number" min="1" placeholder="Ejemplo: 48000"><label>Empresa o detalle</label><input id="note" placeholder="Ej: Enel · noviembre"><label>Fecha</label><input id="date" type="date"><div id="billfields"><label>Fecha de vencimiento (también fechas pasadas)</label><input id="due" type="date"><label>Ya pagada <input id="fully" type="checkbox"></label></div><div class="error" id="err"></div><br><button class="btn primary full" onclick="save()">Guardar</button>');$('type').value=x?.type||type;$('cat').value=x?.category||(type==='income'?'Sueldo':type==='bill'?'Luz':'Bencina');$('amt').value=x?.amount||'';$('note').value=x?.note||'';$('date').value=x?.date||today();$('due').value=x?.due||today();$('fully').checked=!!(x&&x.type==='bill'&&owed(x)===0);switchType()}
function switchType(){$('billfields').style.display=$('type').value==='bill'?'block':'none'}
function save(){let type=$('type').value,amount=Math.round(Number($('amt').value)),date=$('date').value,due=type==='bill'?$('due').value:'';if(!Number.isSafeInteger(amount)||amount<=0||!date||(type==='bill'&&!due)){$('err').textContent='Completa el monto y las fechas correctamente.';return}const old=db.items.find(x=>x.id===editing);if(old&&type==='bill'&&paid(old)>amount){$('err').textContent='El monto es menor a los abonos existentes.';return}let x={id:old?.id||id(),type,amount,date,due,category:$('cat').value,note:$('note').value.trim(),payments:type==='bill'&&old?.type==='bill'?[...old.payments]:[]};if(type==='bill'&&$('fully').checked&&owed(x)>0)x.payments.push({id:id(),date,amount:owed(x),method:'Pago total'});if(old)db.items[db.items.indexOf(old)]=x;else db.items.push(x);persist();close();render()}
function detail(key){const x=db.items.find(z=>z.id===key);if(!x)return;modal('<div class="row"><h2>'+esc(x.category)+'</h2><button onclick="close()">×</button></div><h2>'+money(x.amount)+'</h2><p class="muted">'+esc(x.note)+'</p>'+(x.type==='bill'?'<p>Vence: '+esc(x.due)+'<br>Pagado: '+money(paid(x))+'<br>Saldo: '+money(owed(x))+'</p><h2>Abonos</h2>'+(x.payments||[]).map(p=>'<p>'+esc(p.date)+' · '+esc(p.method)+' · '+money(p.amount)+'</p>').join(''):'')+'<div class="actions">'+(x.type==='bill'&&owed(x)>0?'<button class="btn primary" onclick="payment(\''+esc(key)+'\')">Pagar / abonar</button>':'')+'<button class="btn" onclick="openEntryForm(\''+x.type+'\',\''+esc(key)+'\')">Editar</button><button class="btn" onclick="remove(\''+esc(key)+'\')">Eliminar</button></div>')}
function payment(key){let x=db.items.find(z=>z.id===key);if(!x)return;modal('<div class="row"><h2>Abonar '+esc(x.category)+'</h2><button onclick="close()">×</button></div><p>Saldo por pagar: '+money(owed(x))+'</p><label>Monto abonado</label><input id="payAmt" type="number" min="1" max="'+owed(x)+'" value="'+owed(x)+'"><label>Fecha</label><input id="payDate" type="date" value="'+today()+'"><label>Medio de pago</label><select id="method"><option>Transferencia</option><option>Débito</option><option>Crédito</option><option>Efectivo</option></select><div class="error" id="err"></div><br><button class="btn primary full" onclick="savePayment(\''+esc(key)+'\')">Confirmar abono</button>')}
function savePayment(key){let x=db.items.find(z=>z.id===key),v=Number($('payAmt').value),date=$('payDate').value;if(!x||!Number.isSafeInteger(v)||v<=0||v>owed(x)||!date){$('err').textContent='Monto o fecha inválidos.';return}x.payments.push({id:id(),amount:v,date,method:$('method').value});persist();close();render()}
function remove(key){if(confirm('¿Eliminar el registro y todos sus pagos?')){db.items=db.items.filter(x=>x.id!==key);persist();close();render()}}
function setBudget(){let v=Number($('budget').value);if(!Number.isSafeInteger(v)||v<0){alert('Monto incorrecto');return}db.budget=v;persist();render()}
function download(name,content,mime){let url=URL.createObjectURL(new Blob([content],{type:mime})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function backup(){download('Mis_Gastos_Respaldo_'+today()+'.json',JSON.stringify({schema:2,data:db},null,2),'application/json')}
function csv(){let out=[['Fecha','Tipo','Categoría','Monto','Detalle','Vencimiento','Estado','Saldo']];for(let x of db.items){out.push([x.date,x.type,x.category,x.amount,x.note,x.due,state(x),x.type==='bill'?owed(x):'']);for(let p of x.payments||[])out.push([p.date,'abono',x.category,p.amount,p.method,x.due,'',''])}download('Mis_Gastos_'+today()+'.csv','\ufeff'+out.map(row=>row.map(z=>'"'+String(z??'').replace(/"/g,'""')+'"').join(';')).join('\r\n'),'text/csv;charset=utf-8')}
$('file').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let obj=JSON.parse(await file.text()),d=obj.data||obj;if(!Array.isArray(d.items))throw Error('Archivo no compatible');if(confirm('¿Reemplazar todos los registros con el respaldo?')){db=d;persist();render()}}catch(err){alert(err.message)}e.target.value=''};render();
</script></body></html>
