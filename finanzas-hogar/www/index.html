:root{color-scheme:dark;--bg:#0b1729;--card:#1b2940;--line:#33435d;--mint:#43daa5;--muted:#acbbcf;--red:#ff8587}*{box-sizing:border-box}body{margin:0;font:15px system-ui,-apple-system,sans-serif;background:var(--bg);color:white}header{padding:20px 18px 8px}header strong{font-size:22px}small,.muted{color:var(--muted)}main{padding:10px 14px 115px;max-width:620px;margin:auto}.card{background:var(--card);padding:17px;border-radius:19px;margin-bottom:13px}.balance{background:linear-gradient(135deg,#184a4a,#162b4b)}.balance .big{font-size:33px;color:var(--mint);display:block;margin:9px 0;font-weight:800}h2{font-size:18px;margin:0 0 12px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.row>*{min-width:0}.positive{color:var(--mint)}.bad{color:var(--red)}.line{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding:13px 0;cursor:pointer}.line .ico{font-size:25px;width:36px}.line .detail{flex:1;min-width:0}.line .detail strong{display:block}.line .detail small{display:block;white-space:normal}.line .amount{font-weight:700;white-space:nowrap}.tag{font-size:11px;padding:2px 7px;border-radius:12px;background:#354961;display:inline-block;margin-top:5px}.tag.late{background:#612d3a;color:#ffb8b9}.actions,.filters{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0}.btn,button{border:0;border-radius:12px;padding:12px;color:white;background:#34445e;font:inherit;cursor:pointer}.btn.primary{background:#147f66;font-weight:700}.actions>.btn{flex:1;min-width:135px}.full{width:100%}.filters button.on{background:#147f66}nav{position:fixed;bottom:0;left:0;right:0;background:#142239;display:flex;padding:9px 3px max(10px,env(safe-area-inset-bottom));box-shadow:0 -8px 25px #061020b0}nav button{flex:1;font-size:11px;padding:7px 2px;background:transparent;color:var(--muted)}nav button.on{color:var(--mint)}nav button b{display:block;font-size:20px}label{display:block;color:var(--muted);margin:13px 0 5px;font-size:13px}input,select{width:100%;padding:13px;border:1px solid #435774;background:#0f1c30;color:white;border-radius:10px;font:inherit}input[type=checkbox]{width:auto}.overlay{display:none;position:fixed;inset:0;z-index:4;background:#030914bb;align-items:end}.overlay.on{display:flex}.sheet{background:#1b2940;border-radius:22px 22px 0 0;padding:20px;width:100%;max-height:92vh;overflow:auto}.sheet h2{margin:0}.sheet .row{margin-bottom:10px}.plot{width:140px;height:140px;border-radius:50%;margin:14px auto;background:#35445c;display:grid;place-items:center}.plot span{width:85px;height:85px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;font-size:12px}.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px}.legend div{font-size:12px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}.progress{height:9px;background:#33435d;border-radius:10px;overflow:hidden;margin:12px 0}.progress div{background:var(--mint);height:100%}.empty{color:var(--muted);padding:13px 0}.toolbar{display:flex;align-items:center;justify-content:center;gap:25px;margin-bottom:12px}.toolbar button{font-size:23px;padding:4px 12px}.error{color:var(--red);margin-top:8px}#file{display:none}
</style><style>
body{background:#0d1729}header{background:linear-gradient(115deg,#083f37,#0c2337 78%);padding:19px 19px 16px;text-align:center;border-bottom:1px solid #244350}header strong{font-size:19px;letter-spacing:.2px}main{padding-top:14px}.card{background:#1c293e;border:1px solid #26354d;box-shadow:0 5px 18px #07102133;border-radius:16px}.balance{background:linear-gradient(135deg,#0b5448,#12273f 95%);text-align:center;padding:21px 15px 18px}.balance .big{font-size:clamp(29px,8vw,40px);margin:5px 0 17px}.balance small{letter-spacing:.4px}.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:16px 0 0}.statcard{background:#1c293e;border-radius:14px;padding:14px 10px;display:flex;align-items:center;gap:8px;min-width:0}.statcard .statIcon{display:grid;place-items:center;flex-shrink:0;border-radius:50%;background:#1c594d;width:32px;height:32px;color:#56edb0;font-size:20px}.statcard.out .statIcon{background:#574047;color:#ff987d}.statcard small{display:block;font-size:12px}.statcard strong{font-size:15px;white-space:nowrap}.primaryHero{width:100%;display:flex;justify-content:flex-start;align-items:center;gap:13px;text-align:left;background:#26354c;border-radius:13px;margin:2px 0 13px;font-weight:700}.primaryHero .plus{background:#315778;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;font-size:24px}.dashboardChart{display:flex;align-items:center;gap:12px}.dashboardChart .plot{width:132px;height:132px;flex:0 0 132px;margin:10px 0}.dashboardChart .plot span{width:78px;height:78px}.dashboardChart .legend{flex:1;display:block}.dashboardChart .legend div{margin:9px 0;font-size:12px}.urgent{display:flex;justify-content:space-between;align-items:center;background:#392937;padding:12px;border-radius:12px;margin-bottom:12px;gap:12px}.urgent .bad{font-weight:bold}nav{border-top:1px solid #2d3d54}nav button.on{color:#43daa5}

<style id="financeIntegratedStyle">
.financeQuick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}

.financeTypes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:9px 0 15px}

const financeIconPaths={"home":"M3 10l9-7 9 7v11h-6v-7H9v7H3z","calendar":"M3 5h18v16H3z M7 2v6 M17 2v6 M3 10h18","list":"M5 3h14v18H5z M8 8h8 M8 12h8 M8 16h8","chart":"M3 3v18h18 M7 16v-5 M12 16V7 M17 16V4","settings":"M12 3v3 M12 18v3 M3 12h3 M18 12h3 M5 5l2 2 M17 17l2 2 M5 19l2-2 M17 7l2-2 M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0","fuel":"M3 21h12 M5 21V3h9v18 M7 6h5v5H7z M14 13h3v5a2 2 0 0 0 4 0V9l-4-4","wifi":"M2 8q10-9 20 0 M5 12q7-6 14 0 M9 16q3-3 6 0 M12 20h.01","health":"M9 3h6v6h6v6h-6v6H9v-6H3V9h6z","car":"M3 16v-5l3-6h12l3 6v5H3z M5 16v3 M19 16v3 M3 11h18 M7 14h.01 M17 14h.01","school":"M3 21h18 M5 21V10l7-6 7 6v11 M10 21v-6h4v6 M8 11h.01 M16 11h.01","pill":"M5 19a5 5 0 0 1 0-7l7-7a5 5 0 0 1 7 7l-7 7a5 5 0 0 1-7 0 M9 9l6 6","parking":"M3 3h18v18H3z M9 17V7h4a3 3 0 0 1 0 6H9","cart":"M2 3h3l3 12h11l3-9H6 M9 20h.01 M18 20h.01","bolt":"M13 2L4 14h7l-1 8 10-12h-7z","water":"M12 2C9 7 5 11 5 15a7 7 0 0 0 14 0c0-4-4-8-7-13z","card":"M2 5h20v14H2z M2 10h20 M6 15h4","phone":"M7 2h10v20H7z M11 18h2","flame":"M12 2c2 6 7 8 7 13a7 7 0 0 1-14 0c0-4 3-7 5-9l2 5z","tv":"M3 5h18v13H3z M8 22h8","more":"M5 12h.01 M12 12h.01 M19 12h.01","food":"M5 3v7q3 4 6 0V3 M8 3v18 M18 3v18 M18 3q-5 5 0 10","wallet":"M3 5h17v15H3z M20 10h-6v5h6 M16 12h.01"};
function financeSvg(k){return '<svg aria-hidden="true" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="'+(financeIconPaths[k]||financeIconPaths.more)+'"/></svg>'}
function financeCategoryIcon(c){const n=String(c||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();const pairs=[[/bencina|diesel|combustible|parafina/,'fuel'],[/internet|wifi/,'wifi'],[/farmacia|medicamento/,'pill'],[/salud|medic/,'health'],[/estacionamiento|parking/,'parking'],[/transporte|auto|peaje/,'car'],[/educacion|colegio/,'school'],[/supermercado|compras/,'cart'],[/alimentacion|restaurante|comida/,'food'],[/luz|electricidad/,'bolt'],[/agua/,'water'],[/arriendo|dividendo|vivienda|contribuciones/,'home'],[/credito|tarjeta/,'card'],[/celular|telefon/,'phone'],[/gas/,'flame'],[/suscrip|netflix|spotify/,'tv'],[/sueldo|ingreso/,'wallet']];return financeSvg(pairs.find(([r])=>r.test(n))?.[1]||'more')}

const KEY='mis_gastos_chile_capacitor_v2',cats=['Luz','Agua','Gas','Internet','Plan celular','Arriendo','Dividendo','Contribuciones','Bencina','Diésel','Parafina','Supermercado','Alimentación','Transporte','Salud','Educación','Crédito','Tarjeta','Otros'],icons={'Luz':'⚡','Agua':'💧','Gas':'🔥','Internet':'🌐','Plan celular':'📱','Bencina':'⛽','Diésel':'⛽','Parafina':'🛢️','Supermercado':'🛒','Sueldo':'💰'},groups=['Servicios','Alimentación','Transporte','Vivienda','Otros'],colors=['#729bc6','#80b5a9','#a6a0c2','#c7ab83','#c68d98'];
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),today=()=>iso(new Date()),id=()=>Date.now()+'-'+Math.random().toString(36).slice(2),money=n=>(db.currency==='CLP'?'$':db.currency+' ')+Math.round(n||0).toLocaleString('es-CL'),paid=x=>(x.payments||[]).reduce((a,p)=>a+Number(p.amount||0),0),owed=x=>Math.max(0,x.amount-paid(x)),state=x=>x.type!=='bill'?'':owed(x)===0?'Pagada':x.due<today()?'Vencida':'Pendiente',group=c=>['Luz','Agua','Gas','Internet','Plan celular'].includes(c)?0:['Supermercado','Alimentación'].includes(c)?1:['Bencina','Diésel','Parafina','Transporte'].includes(c)?2:['Arriendo','Dividendo','Contribuciones'].includes(c)?3:4;
let db={budget:0,currency:'CLP',items:[]},tab='inicio',filter='Pendientes',month=new Date(new Date().getFullYear(),new Date().getMonth(),1),editing=null;
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Array.isArray(saved.items))db=saved}catch(e){}
const persist=()=>localStorage.setItem(KEY,JSON.stringify(db)),thisMonth=d=>String(d||'').slice(0,7)===iso(month).slice(0,7);
function totals(){let income=0,expenses=0,pending=0,late=0;for(const x of db.items){if(x.type==='income'&&thisMonth(x.date))income+=x.amount;if(x.type==='expense'&&thisMonth(x.date))expenses+=x.amount;if(x.type==='bill'){pending+=owed(x);if(state(x)==='Vencida')late+=owed(x);for(const p of x.payments||[])if(thisMonth(p.date))expenses+=p.amount}}return{income,expenses,pending,late}}
function monthbar(){return '<div class="toolbar"><button onclick="changeMonth(-1)">‹</button><b>'+esc(new Intl.DateTimeFormat('es-CL',{month:'long',year:'numeric'}).format(month))+'</b><button onclick="changeMonth(1)">›</button></div>'}
function changeMonth(n){month=new Date(month.getFullYear(),month.getMonth()+n,1);render()}
function list(items){return items.length?items.map(x=>'<div class="line" data-id="'+esc(x.id)+'"><div class="ico">'+financeCategoryIcon(x.category)+'</div><div class="detail"><strong>'+esc(x.category)+'</strong><small>'+esc((x.type==='bill'?'Vence '+x.due:x.date)+(x.note?' · '+x.note:''))+'</small>'+(x.type==='bill'?'<span class="tag '+(state(x)==='Vencida'?'late':'')+'">'+state(x)+'</span>':'')+'</div><span class="amount '+(x.type==='income'?'positive':state(x)==='Vencida'?'bad':'')+'">'+(x.type==='income'?'+':'−')+money(x.type==='bill'?owed(x):x.amount)+'</span></div>').join(''):'<div class="empty">No hay registros todavía.</div>'}
function bills(f='Pendientes',n=999){return db.items.filter(x=>x.type==='bill'&&(f==='Todas'||f==='Pendientes'&&owed(x)>0||f==='Vencidas'&&state(x)==='Vencida'||f==='Pagadas'&&owed(x)===0)).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,n)}
function summary(){const t=totals(),recent=db.items.filter(x=>x.type!=='bill'&&thisMonth(x.date)).sort((a,b)=>b.date.localeCompare(a.date));let v=[0,0,0,0,0];for(const x of db.items){if(x.type==='expense'&&thisMonth(x.date))v[group(x.category)]+=x.amount;if(x.type==='bill')for(const p of x.payments||[])if(thisMonth(p.date))v[group(x.category)]+=p.amount}let angle=0,gradient=v.map((n,i)=>{let a=angle;angle+=n/(t.expenses||1)*360;return n?colors[i]+' '+a+'deg '+angle+'deg':''}).filter(Boolean).join(',');return monthbar()+'<section class="card balance"><small>Balance de ingresos y gastos del mes</small><strong class="big">'+money(t.income-t.expenses)+'</strong><div class="statgrid"><div class="statcard"><div class="statIcon">↑</div><div style="text-align:left"><small>Ingresos</small><strong>'+money(t.income)+'</strong></div></div><div class="statcard out"><div class="statIcon">↓</div><div style="text-align:left"><small>Gastos</small><strong>'+money(t.expenses)+'</strong></div></div></div></section><button class="btn primaryHero" onclick="openEntryForm(\'expense\')"><span class="plus">＋</span>Añadir Gasto / Ingreso</button><section class="card"><h2>Gráfico visual</h2><div class="dashboardChart"><div class="plot" style="background:'+(gradient?'conic-gradient('+gradient+')':'#35445c')+'"><span>'+money(t.expenses)+'</span></div><div class="legend">'+groups.map((n,i)=>'<div><i class="dot" style="background:'+colors[i]+'"></i>'+n+' · '+(t.expenses?Math.round(v[i]/t.expenses*100):0)+'%</div>').join('')+'</div></div></section><section class="card"><h2>Cuentas por pagar</h2><div class="urgent"><span><strong>'+money(t.pending)+'</strong><br><small>Saldo pendiente</small></span><span class="bad">Vencidas<br>'+money(t.late)+'</span></div>'+list(bills('Pendientes',3))+'<button class="btn primary full" onclick="openEntryForm(\'bill\')">＋ Registrar cuenta de luz, agua, gas...</button></section><section class="card"><h2>Lista de últimos movimientos</h2>'+list(recent.slice(0,6))+'</section>'}
function accounts(){let t=totals();return '<section class="card"><h2>Cuentas por pagar</h2><small>Total pendiente</small><div class="big positive" style="font-size:29px;font-weight:bold">'+money(t.pending)+'</div><b class="bad">Atrasadas: '+money(t.late)+'</b></section><button class="btn primary full" onclick="openEntryForm(\'bill\')">＋ Registrar cuenta, incluso vencida</button><div class="filters">'+['Pendientes','Vencidas','Pagadas','Todas'].map(f=>'<button class="'+(filter===f?'on':'')+'" data-filter="'+f+'">'+f+'</button>').join('')+'</div><section class="card">'+list(bills(filter))+'</section>'}
let historyLimit=80;
function moreHistory(){historyLimit+=80;render();}
function movements(){
  let arr=db.items.filter(x=>x.type!=='bill');
  for(const x of db.items.filter(x=>x.type==='bill'))for(const p of x.payments||[])arr.push({...x,type:'expense',date:p.date,amount:p.amount,note:'Abono · '+x.note});
  arr.sort((a,b)=>b.date.localeCompare(a.date));
  return '<section class="card"><div class="row"><h2>Movimientos</h2><button onclick="openEntryForm(\'expense\')">＋ Gasto</button></div>'
   +'<small class="muted">Mostrando '+Math.min(historyLimit,arr.length)+' de '+arr.length+' movimientos. La exportación incluye todos.</small>'
   +list(arr.slice(0,historyLimit))
   +(arr.length>historyLimit?'<button class="btn full" onclick="moreHistory()">Mostrar 80 más</button>':'')+'</section>';
}
function stats(){let t=totals(),v=[0,0,0,0,0];for(const x of db.items){if(x.type==='expense'&&thisMonth(x.date))v[group(x.category)]+=x.amount;for(const p of x.payments||[])if(thisMonth(p.date))v[group(x.category)]+=p.amount}let angle=0,gradient=v.map((n,i)=>{let a=angle;angle+=n/(t.expenses||1)*360;return n?colors[i]+' '+a+'deg '+angle+'deg':''}).filter(Boolean).join(',');return monthbar()+'<section class="card"><h2>Distribución de gastos</h2><div class="plot" style="background:'+(gradient?'conic-gradient('+gradient+')':'#35445c')+'"><span>'+money(t.expenses)+'</span></div><div class="legend">'+groups.map((n,i)=>'<div><i class="dot" style="background:'+colors[i]+'"></i>'+n+': '+(t.expenses?Math.round(v[i]/t.expenses*100):0)+'%</div>').join('')+'</div></section>'}
function settings(){return '<section class="card"><h2>Exportar movimientos</h2><p class="muted">Guarda el listado de ingresos, gastos y pagos o ábrelo en Excel o Google Sheets desde tu celular.</p><button class="btn primary full" onclick="csv()">📊 Exportar para Excel</button><small class="muted" style="display:block;margin-top:10px">Se abre el menú del celular para guardar, enviar o compartir el archivo CSV compatible con hojas de cálculo.</small></section><section class="card"><details><summary style="cursor:pointer;font-weight:650">🔒 Copias de seguridad (opcional)</summary><p class="muted">Úsalas solo para cambiar de teléfono o recuperar datos después de reinstalar. La copia incluye tus movimientos y comprobantes.</p><button class="btn full" onclick="backup()">Guardar copia completa</button><br><br><button class="btn full" onclick="$(\'file\').click()">Recuperar copia guardada</button></details></section>'}
function render(){$('app').innerHTML=({inicio:summary,cuentas:accounts,movimientos:movements,estadisticas:stats,ajustes:settings}[tab])();$('nav').innerHTML=[['inicio','🏠','Inicio'],['cuentas','📅','Cuentas'],['movimientos','📋','Movimientos'],['estadisticas','📊','Gráficos'],['ajustes','⚙','Ajustes']].map(([x,i,t])=>'<button data-tab="'+x+'" class="'+(x===tab?'on':'')+'"><b>'+i+'</b>'+t+'</button>').join('');document.querySelectorAll('[data-tab]').forEach(n=>n.onclick=()=>{tab=n.dataset.tab;render()});document.querySelectorAll('[data-id]').forEach(n=>n.onclick=()=>detail(n.dataset.id));document.querySelectorAll('[data-filter]').forEach(n=>n.onclick=()=>{filter=n.dataset.filter;render()})}
function modal(html){$('sheet').innerHTML=html;$('overlay').classList.add('on')}function dismissSheet(){editing=null;$('overlay').classList.remove('on')}
function backInApp(){if($('overlay').classList.contains('on')){dismissSheet();return true}if(tab!=='inicio'){tab='inicio';render();return true}return false}
$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))dismissSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'||(e.key==='Backspace'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))){if(backInApp())e.preventDefault()}});
window.addEventListener('popstate',()=>{backInApp()});

/* MEJORAS V1.2 — comprobantes locales, exportación móvil y respaldo íntegro */
let selectedReceipt=null;
const receiptsDB=()=>new Promise((resolve,reject)=>{
  const req=indexedDB.open('mis-gastos-comprobantes-v1',1);
  req.onupgradeneeded=()=>req.result.createObjectStore('archivos');
  req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
});
async function receiptStore(key,blob){
  const d=await receiptsDB();
  try{await new Promise((resolve,reject)=>{const t=d.transaction('archivos','readwrite');t.objectStore('archivos').put(blob,key);t.oncomplete=resolve;t.onerror=()=>reject(t.error);});}
  finally{d.close();}
}
async function receiptRead(key){
  const d=await receiptsDB();
  try{return await new Promise((resolve,reject)=>{const t=d.transaction('archivos','readonly'),q=t.objectStore('archivos').get(key);q.onsuccess=()=>resolve(q.result||null);q.onerror=()=>reject(q.error);});}
  finally{d.close();}
}
async function receiptDelete(key){
  const d=await receiptsDB();
  try{await new Promise((resolve,reject)=>{const t=d.transaction('archivos','readwrite');t.objectStore('archivos').delete(key);t.oncomplete=resolve;t.onerror=()=>reject(t.error);});}
  finally{d.close();}
}
const receiptMaxSize=8*1024*1024;
function receiptControls(){
  const sheet=$('sheet');
  const holder=document.createElement('div');
  holder.innerHTML='<label for="receiptPick">📎 Comprobante (fotografía o PDF, opcional)</label><input type="file" id="receiptPick" accept="image/jpeg,image/png,image/webp,application/pdf,image/*" style="color:#fff"><small id="receiptHelp" style="display:block;margin-top:8px">Puedes adjuntar una boleta, factura o comprobante de transferencia, hasta 8 MB.</small>';
  const saveButton=sheet.querySelector('button[onclick="save()"]');
  if(saveButton)saveButton.before(holder);else sheet.append(holder);
  const input=$('receiptPick');
  input.addEventListener('change',()=>{
    const file=input.files&&input.files[0];
    selectedReceipt=null;
    if(!file)return;
    const valid=file.type==='application/pdf'||file.type.startsWith('image/');
    if(!valid||file.size>receiptMaxSize){
      alert('Solo fotos o PDF de hasta 8 MB. Elige otro archivo.');
      input.value='';return;
    }
    selectedReceipt=file;
    $('receiptHelp').textContent='Seleccionado: '+file.name;
  });
}

const basicSave=save;
save=async function(){
  const priorId=editing, prior=priorId?db.items.find(x=>x.id===priorId):null;
  if(prior&&prior.type==='bill'&&paid(prior)>0&&$('type').value!=='bill'){
    $('err').textContent='Esta cuenta tiene abonos. No puedes cambiarla a ingreso o gasto sin perder el historial.';return;
  }
  const before=new Set(db.items.map(x=>x.id)), file=selectedReceipt;

  if($('overlay').classList.contains('on'))return;
  const item=priorId?db.items.find(x=>x.id===priorId):db.items.find(x=>!before.has(x.id));
  selectedReceipt=null;
  if(!item||!file)return;
  try{
    await receiptStore(item.id,file);
    item.receipt={name:file.name,mime:file.type,size:file.size};
    persist();render();

const basicRemove=remove;
remove=function(key){
  if(!confirm('¿Eliminar este movimiento, sus abonos y su comprobante? Esta acción no se puede deshacer.'))return;
  db.items=db.items.filter(x=>x.id!==key);persist();dismissSheet();render();

function blobDataUrl(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(blob);});}
function dataUrlBlob(data){
  const parts=data.split(','),mime=/data:(.*?);/.exec(parts[0])?.[1]||'application/octet-stream',binary=atob(parts[1]||''),bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);return new Blob([bytes],{type:mime});
}
async function shareMobile(filename,blob,mime){
  try{
    const cap=window.Capacitor;
    const fs=cap?.Plugins?.Filesystem||(cap?.registerPlugin?cap.registerPlugin('Filesystem'):null);
    const share=cap?.Plugins?.Share||(cap?.registerPlugin?cap.registerPlugin('Share'):null);
    if(fs&&share){
      const data=await blobDataUrl(blob),safe=filename.replace(/[^A-Za-z0-9_.-]/g,'_');
      const path='exportaciones/'+Date.now()+'_'+safe;
      await fs.writeFile({path,data:data.split(',')[1],directory:'CACHE',recursive:true});
      const uri=await fs.getUri({path,directory:'CACHE'});
      await share.share({title:'Mis Gastos Chile',url:uri.uri,dialogTitle:'Abrir, compartir o guardar archivo'});
      return;
    }
  }catch(error){console.warn('No se pudo abrir el menú para compartir',error);}
  const uri=URL.createObjectURL(blob),a=document.createElement('a');a.href=uri;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(uri),10000);
}
csv=async function(){
  const out=[['Fecha','Tipo','Categoría','Monto','Detalle','Vencimiento','Estado','Saldo pendiente','Comprobante']];
  for(const x of db.items){
    out.push([x.date,x.type,x.category,x.amount,x.note||'',x.due||'',state(x),x.type==='bill'?owed(x):'',x.receipt?.name||'']);
    for(const p of x.payments||[])out.push([p.date,'Abono',x.category,p.amount,p.method||'',x.due||'','Pagado','','']);

  const content='\ufeff'+out.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');

backup=async function(){
  const attachments={};
  try{
    for(const item of db.items){if(item.receipt){const blob=await receiptRead(item.id);if(blob)attachments[item.id]=await blobDataUrl(blob);}}
    const data=JSON.stringify({schema:3,data:db,attachments});
    await shareMobile('Respaldo_Mis_Gastos_'+today()+'.json',new Blob([data],{type:'application/json'}),'application/json');
  }catch(e){alert('No se pudo preparar la copia completa. Revisa el espacio disponible.');}

$('file').onchange=async e=>{
  const file=e.target.files?.[0];if(!file)return;
  try{
    const record=JSON.parse(await file.text()),next=record.data||record;
    if(!Array.isArray(next.items))throw Error('Este archivo no es un respaldo válido de Mis Gastos.');
    if(!confirm('¿Recuperar esta copia? Se reemplazarán todos los registros actuales.'))return;
    if(record.attachments){
      for(const [key,data] of Object.entries(record.attachments))await receiptStore(key,dataUrlBlob(data));
    }
    db=next;persist();render();alert('Datos recuperados correctamente.');
  }catch(err){alert('No se pudo recuperar el respaldo: '+err.message);}
  finally{e.target.value='';}

/* Recordatorios de vencimiento: notificaciones programadas en el dispositivo */
const REMINDERS_ENABLED_KEY='finanzas_reminders_enabled_v1';
const REMINDER_IDS_KEY='finanzas_reminder_ids_v1';
let remindersEnabled=localStorage.getItem(REMINDERS_ENABLED_KEY)==='yes';
let reminderChain=Promise.resolve(), reminderTimer=null, reminderError='';
function notificationsPlugin(){
  const cap=window.Capacitor;
  return cap?.Plugins?.LocalNotifications || (cap?.registerPlugin?cap.registerPlugin('LocalNotifications'):null);
}
function reminderId(accountId,days){
  let h=2166136261;
  for(const ch of accountId+'|'+days){h=Math.imul(h^ch.charCodeAt(0),16777619);}
  return 100000000+(h>>>0)%900000000;
}
function reminderDate(due,days){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(due||''))return null;
  const [y,m,d]=due.split('-').map(Number);
  const date=new Date(y,m-1,d,9,0,0,0);
  if(date.getFullYear()!==y||date.getMonth()!==m-1||date.getDate()!==d)return null;
  date.setDate(date.getDate()-days);
  return date;
}
function reminderPlan(){
  const list=[];
  if(!remindersEnabled)return list;
  for(const x of db.items){
    if(x.type!=='bill'||owed(x)<=0||!x.due)continue;
    for(const days of [5,3]){
      const at=reminderDate(x.due,days);
      if(!at||at.getTime()<=Date.now())continue;
      list.push({id:reminderId(x.id,days),title:'Cuenta por vencer: '+x.category,
        body:'Faltan '+days+' días para pagar '+(x.note?x.note+' · ':'')+money(owed(x))+'.',
        schedule:{at},channelId:'cuentas-vencimiento',extra:{source:'finanzas-cuentas',accountId:x.id,days}});
    }
  }
  list.sort((a,b)=>a.schedule.at-b.schedule.at);
  return list.slice(0,120);
}
async function syncReminders(){
  const plugin=notificationsPlugin();
  if(!plugin)return;
  const granted=await plugin.checkPermissions();
  if(granted.display!=='granted')return;
  const previous=JSON.parse(localStorage.getItem(REMINDER_IDS_KEY)||'[]');
  const targets=reminderPlan();
  const ids=targets.map(x=>x.id);
  if(previous.length)await plugin.cancel({notifications:previous.map(id=>({id}))});
  if(targets.length){
    await plugin.createChannel({id:'cuentas-vencimiento',name:'Recordatorios de cuentas',description:'Avisos de cuentas pendientes',importance:4,visibility:1});
    await plugin.schedule({notifications:targets});
  }
  localStorage.setItem(REMINDER_IDS_KEY,JSON.stringify(ids));
  reminderError='';
}
function queueReminderSync(){
  if(reminderTimer)clearTimeout(reminderTimer);
  reminderTimer=setTimeout(()=>{
    reminderChain=reminderChain.catch(()=>{}).then(syncReminders).catch(e=>{reminderError=String(e.message||e);console.warn('Recordatorios:',e)});
  },300);
}
async function setReminders(enabled){
  const plugin=notificationsPlugin();
  if(enabled){
    if(!plugin){alert('Los recordatorios solo funcionan en la aplicación Android instalada.');return;}
    const permission=await plugin.checkPermissions();
    const allowed=permission.display==='granted'?permission:await plugin.requestPermissions();
    if(allowed.display!=='granted'){alert('Activa las notificaciones de Mis Gastos Chile en Ajustes del teléfono.');return;}
  }
  remindersEnabled=enabled;
  localStorage.setItem(REMINDERS_ENABLED_KEY,enabled?'yes':'no');
  try{await syncReminders()}catch(e){reminderError=String(e.message||e);alert('No se pudieron configurar todos los avisos. Revisa los permisos de notificaciones en el teléfono.');}
  render();
}
function reminderSettings(){
  return '<section class="card"><h2>🔔 Avisos de cuentas por vencer</h2><p class="muted">Recibe un aviso 5 días y otro 3 días antes del vencimiento de tus cuentas pendientes, aunque no tengas la aplicación abierta.</p>'
   +'<button class="btn '+(remindersEnabled?'':'primary')+' full" onclick="setReminders('+(!remindersEnabled)+')">'+(remindersEnabled?'Desactivar recordatorios':'Activar recordatorios')+'</button>'
   +'<small class="muted" style="display:block;margin-top:10px">'+(remindersEnabled?'Recordatorios activados. Se actualizarán al registrar pagos o cambiar vencimientos.':'Debes autorizar las notificaciones de Android para recibirlos.')+'</small></section>';
}
const originalSettings=settings;
settings=function(){return reminderSettings()+originalSettings();};

const remindersSave=save;
save=async function(){
  await remindersSave();
  queueReminderSync();
};
const remindersPayment=savePayment;
savePayment=function(key){
  remindersPayment(key);
  queueReminderSync();
};
const remindersRemove=remove;
remove=function(key){
  remindersRemove(key);
  queueReminderSync();
};
const oldRestore=$('file').onchange;
$('file').onchange=async function(event){
  await oldRestore(event);
  queueReminderSync();
};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)queueReminderSync();});
window.addEventListener('focus',queueReminderSync);
queueReminderSync();

/* MIS FINANZAS — mejoras integradas de seguridad, experiencia y recurrencia */
let financeNoticeTimer=null, financeDirty=false, financeModalInitial='', financeListQuery='', financeListCategory='Todas', financeListMonth='Todos';
function financeNotify(message,bad=false){
  let node=$('financeNotice');
  if(!node){node=document.createElement('div');node.id='financeNotice';node.setAttribute('role','status');document.body.append(node);}
  node.textContent=message;node.className=bad?'notice bad':'notice';node.style.display='block';
  clearTimeout(financeNoticeTimer);financeNoticeTimer=setTimeout(()=>{node.style.display='none';},3200);
}
function financeDateText(d){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d||''))return 'Sin fecha';
  const a=d.split('-');return a[2]+'/'+a[1]+'/'+a[0];
}
function financeMonthlyNext(d){
  const [year,monthNo,day]=String(d).split('-').map(Number);
  const last=new Date(year,monthNo+1,0).getDate();
  return iso(new Date(year,monthNo,Math.min(day,last)));
}
function financeRecordType(x){return x.type==='income'?'Ingreso':x.type==='bill'?'Cuenta pendiente':'Gasto pagado';}
function financeRecurringDue(x){
  if(!x.subscriptionDay)return financeMonthlyNext(x.due);
  const [y,m]=x.due.split('-').map(Number);
  return iso(new Date(y,m,Math.min(Number(x.subscriptionDay),new Date(y,m+1,0).getDate())));
}
function financeFutureBill(x){
  if(!x||x.type!=='bill'||!x.recurring||owed(x)>0||!x.due)return null;
  const nextDue=financeRecurringDue(x),root=x.seriesId||x.id;
  if(db.items.some(z=>z.type==='bill'&&(z.seriesId||z.id)===root&&z.due===nextDue))return null;
  const newBill={id:id(),type:'bill',amount:x.amount,date:today(),due:nextDue,category:x.category,note:x.note||'',payments:[],recurring:true,seriesId:root,...(x.subscriptionId?{subscriptionId:x.subscriptionId,subscriptionService:x.subscriptionService,subscriptionPlan:x.subscriptionPlan,subscriptionDay:x.subscriptionDay,subscriptionCustomService:x.subscriptionCustomService,subscriptionCustomPlan:x.subscriptionCustomPlan}:{})};

async function financeSave(){
  const form=$('financeForm');if(!form)return;
  const type=$('type').value,amount=Number($('amt').value),date=$('date').value,due=type==='bill'?$('due').value:'';
  if(!Number.isSafeInteger(amount)||amount<=0||!date||(type==='bill'&&!due)){
    $('err').textContent='Ingresa un monto válido y completa las fechas.';return;
  }
  const old=db.items.find(z=>z.id===editing);
  if(old?.type==='bill'&&old.payments?.length&&type!=='bill'){
    $('err').textContent='No puedes cambiar el tipo de una cuenta con abonos. Corrige primero sus pagos.';return;
  }
  if(type==='bill'&&old&&paid(old)>amount){
    $('err').textContent='El monto no puede ser menor que los pagos ya registrados.';return;
  }
  const x={id:old?.id||id(),type,amount,date,due,category:$('cat').value,note:$('note').value.trim(),
    payments:type==='bill'&&old?.type==='bill'?(old.payments||[]).map(p=>({...p})):[],
    ...(old?.receipt?{receipt:old.receipt}:{}),
    recurring:type==='bill'&&$('recurring').checked,seriesId:old?.seriesId||old?.id||'', ...(old?.subscriptionId&&type==='bill'?{subscriptionId:old.subscriptionId,subscriptionService:old.subscriptionService,subscriptionPlan:old.subscriptionPlan,subscriptionDay:old.subscriptionDay,subscriptionCustomService:old.subscriptionCustomService,subscriptionCustomPlan:old.subscriptionCustomPlan}:{})};
  if(type==='bill'&&$('fully').checked&&owed(x)>0){
    x.payments.push({id:id(),date:$('fullDate').value||date,amount:owed(x),method:$('fullMethod').value});
  }
  if(financeDedupeCheck(x)&&!confirm('Ya hay un registro muy parecido con el mismo importe, fecha y detalle. ¿Guardar otro igualmente?'))return;
  const file=selectedReceipt;
  if(file){
    try{await receiptStore(x.id,file);x.receipt={name:file.name,mime:file.type,size:file.size};}
    catch(e){$('err').textContent='El comprobante no se pudo guardar. Libera espacio o retira el adjunto.';return;}
  }
  if(old)db.items[db.items.indexOf(old)]=x;else db.items.push(x);
  const next=financeFutureBill(x);
  try{persist();}catch(e){$('err').textContent='No se pudieron guardar los datos. Revisa el almacenamiento disponible.';return;}
  financeCloseWithoutPrompt();render();queueReminderSync();
  financeNotify(next?'Guardado. Se creó la cuenta pendiente del próximo mes.':'Registro guardado correctamente.');
}

function financeExpandRecurring(){
  const cutoff=new Date();cutoff.setDate(cutoff.getDate()+40);
  const series=new Map();
  db.items.filter(x=>x.type==='bill'&&x.recurring).forEach(x=>{
    const root=x.seriesId||x.id,prev=series.get(root);
    if(!prev||x.due>prev.due)series.set(root,x);
  });
  let added=0;
  for(const last of series.values()){
    let base=last,iterations=0;
    while(base.due&&new Date(base.due+'T00:00:00')<=cutoff&&iterations<12){
      const nextDue=financeRecurringDue(base);
      if(nextDue<=base.due)break;
      let next=db.items.find(x=>x.type==='bill'&&(x.seriesId||x.id)===(base.seriesId||base.id)&&x.due===nextDue);
      if(!next){
        next={id:id(),type:'bill',amount:base.amount,date:today(),due:nextDue,category:base.category,note:base.note,
          payments:[],recurring:true,seriesId:base.seriesId||base.id,...(base.subscriptionId?{subscriptionId:base.subscriptionId,subscriptionService:base.subscriptionService,subscriptionPlan:base.subscriptionPlan,subscriptionDay:base.subscriptionDay,subscriptionCustomService:base.subscriptionCustomService,subscriptionCustomPlan:base.subscriptionCustomPlan}:{})};
        db.items.push(next);added++;
      }
      base=next;iterations++;
    }
  }
  if(added){persist();queueReminderSync();}
  return added;
}
