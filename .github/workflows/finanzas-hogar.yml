name: Compilar Finanzas Hogar V1.1
on:
  push:
    branches: [main]
    paths:
      - 'finanzas-hogar/**'
      - '.github/workflows/finanzas-hogar.yml'
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: finanzas-hogar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Preparar Capacitor
        run: |
          npm install
          node tests/smoke.cjs
          npx cap add android
          npx cap sync android
      - name: Compilar APK de prueba
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Publicar APK en Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="finanzas-v1.1.${{ github.run_number }}"
          cp android/app/build/outputs/apk/debug/app-debug.apk Mis-Gastos-Chile-Finanzas.apk
          gh release create "$TAG" Mis-Gastos-Chile-Finanzas.apk --title "Mis Gastos Chile Finanzas Hogar $TAG" --notes "Nueva app de prueba, separada de la versión Java. Respaldar datos antes de desinstalar cualquier versión." --prerelease --target "$GITHUB_SHA"
