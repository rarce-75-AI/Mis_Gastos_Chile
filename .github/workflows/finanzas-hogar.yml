name: Compilar Mis Finanzas Android
# Firma privada configurada mediante GitHub Actions Secrets; no guardar claves en el repositorio.
on:
  push:
    branches: [main]
    paths:
      - 'finanzas-hogar/**'
      - '.github/workflows/finanzas-hogar.yml'
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FINANZAS_KEYSTORE_B64: ${{ secrets.FINANZAS_KEYSTORE_B64 }}
      FINANZAS_STORE_PASSWORD: ${{ secrets.FINANZAS_STORE_PASSWORD }}
    defaults:
      run:
        working-directory: finanzas-hogar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configurar Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - name: Preparar Capacitor
        run: |
          npm install
          npx esbuild src/statement-xlsx-entry.js --bundle --platform=browser --format=iife --minify --outfile=www/statement-xlsx.js
          node tests/smoke.cjs
          npx cap add android
          npx cap sync android
          python3 -m pip install --quiet cairosvg
          python3 scripts/generate_icons.py
          python3 scripts/configure_android.py
      - name: Compilar APK de prueba sin firma persistente
        if: env.FINANZAS_KEYSTORE_B64 == ''
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Mis-Finanzas.apk
      - name: Compilar APK firmado para futuras actualizaciones
        if: env.FINANZAS_KEYSTORE_B64 != ''
        run: |
          set -eu
          trap 'rm -f "$RUNNER_TEMP/finanzas-signing.jks"' EXIT
          printf '%s' "$FINANZAS_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/finanzas-signing.jks"
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/finanzas-signing.jks" --ks-key-alias finanzas --ks-pass env:FINANZAS_STORE_PASSWORD --key-pass env:FINANZAS_STORE_PASSWORD --out ../Mis-Finanzas.apk app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose ../Mis-Finanzas.apk
          cp app/build/outputs/bundle/release/app-release.aab ../Mis-Finanzas.aab
          jarsigner -keystore "$RUNNER_TEMP/finanzas-signing.jks" -storepass:env FINANZAS_STORE_PASSWORD -keypass:env FINANZAS_STORE_PASSWORD ../Mis-Finanzas.aab finanzas
          jarsigner -verify ../Mis-Finanzas.aab
          unzip -l ../Mis-Finanzas.aab | grep -q 'base/manifest/AndroidManifest.xml'
      - name: Verificar ícono y nombre instalables en APK
        run: |
          test -s Mis-Finanzas.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging Mis-Finanzas.apk | grep -E '^package:|^application-label:|^application-icon-'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging Mis-Finanzas.apk | grep -q "application-label:'Mis Finanzas'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging Mis-Finanzas.apk | grep -q "targetSdkVersion:'36'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump resources Mis-Finanzas.apk | grep -E 'mipmap/mis_finanzas_launcher|drawable/mis_finanzas_foreground' | head -20
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump resources Mis-Finanzas.apk | grep -q 'mipmap/mis_finanzas_launcher'
      - name: Publicar paquetes en Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="finanzas-v1.2.${{ github.run_number }}"
          if [ -n "$FINANZAS_KEYSTORE_B64" ]; then NOTE="APK firmado con clave persistente para actualizar futuras versiones. Primera instalación con esta clave requiere migración desde APK debug."; else NOTE="APK de prueba DEBUG. Android no podrá actualizar una instalación firmada con otra clave. No desinstales sin respaldo verificado."; fi
          set -- Mis-Finanzas.apk
          if [ -n "$FINANZAS_KEYSTORE_B64" ]; then
            test -s Mis-Finanzas.aab
            NOTE="$NOTE APK y AAB firmados con la misma clave. Pendiente de pruebas en dispositivo y revisión de Google Play."
            set -- "$@" Mis-Finanzas.aab
          fi
          sha256sum "$@" > SHA256SUMS.txt
          gh release create "$TAG" "$@" SHA256SUMS.txt --title "Mis Finanzas $TAG" --notes "$NOTE" --prerelease --target "$GITHUB_SHA"
