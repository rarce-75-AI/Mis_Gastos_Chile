name: CalculadoraPro APK de prueba
on:
  push:
    branches: [calculadora-pro-demo]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
      - name: Descomprimir proyecto Kotlin
        run: |
          mkdir -p source
          cat chunks/*.b64 | base64 -d > payload.tar.xz
          test "$(wc -c < payload.tar.xz)" -eq 8256
          echo 'dfc98cae945f265aa4f15503f111d27e544b1a87586588a7850f825dc6a0e512  payload.tar.xz' | sha256sum -c -
          xz -t payload.tar.xz
          tar -xJf payload.tar.xz -C source
      - name: Preparar Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - name: Compilar APK de prueba
        working-directory: source
        run: gradle --no-daemon :app:assembleDebug
      - name: Verificar APK
        run: |
          test -s source/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify source/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging source/app/build/outputs/apk/debug/app-debug.apk | grep "name='cl.rarce.calculadorapro'"
      - name: Publicar APK de prueba
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create calculadora-pro-demo-v0.2.0 source/app/build/outputs/apk/debug/app-debug.apk#CalculadoraPro-v0.2.0-prueba.apk --title "CalculadoraPro v0.2.0 · Prueba" --notes "APK de prueba, firma debug. No publicar en Play Store ni actualizar apps firmadas con otra clave." --target "$GITHUB_SHA" --prerelease
